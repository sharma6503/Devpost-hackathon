[project]
name = "agent-guardian"
version = "0.1.0"
description = "Production-grade multi-agent code & architecture governance system powered by Google ADK"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "gradio>=4.44.0",
    "markdown>=3.10.2",
    "markdownify>=0.11.1",
    "mcp>=1.0.0,<1.25.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.12",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "uvicorn>=0.32.0",
    "beautifulsoup4>=4.14.3",
    "google-adk>=2.5.0",
    "distro>=1.9.0",
    "google-cloud-secret-manager>=2.28.0",
    "pyflakes>=3.2.0",
    "bandit>=1.7.9",
    "jinja2>=3.1.0",
    "httpx>=0.28",
    "google-cloud-aiplatform>=1.158.0",
    "google-cloud-bigquery>=3.27.0",
    "bcrypt>=4.2.0",
    "google-cloud-bigquery-storage>=2.39.0",
    "pyarrow>=25.0.0",
    "mcpdoc>=0.0.10",
    "opentelemetry-exporter-gcp-trace>=1.7.0a0",
    "opentelemetry-exporter-gcp-logging>=1.7.0a0",
    "opentelemetry-exporter-gcp-monitoring>=1.7.0a0",
    "opentelemetry-sdk>=1.42.1",
    "opentelemetry-exporter-otlp-proto-http>=1.42.1",
    "cloudpickle>=3.1.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.9.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E402",  # Module level import not at top of file (intentional in tests/mocks)
    "E501",  # Line too long
]


